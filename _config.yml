# Jekyll configuration for GitHub Pages
title: "Modular Agent Orchestrator"
description: "Revolutionary AI Workflow Platform for the Modern Era"
url: "https://seanivore.github.io"
baseurl: "/modular-agent-orchestrator"

# Theme
remote_theme: pages-themes/minimal@v0.2.0
plugins:
- jekyll-remote-theme

# Markdown settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Collections for organized docs
collections:
  docs:
    output: true
    permalink: /:collection/:name/

# Defaults
defaults:
  - scope:
      path: "documentation"
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "docs"
    values:
      layout: "default"

# Navigation
header_pages:
  - documentation/00_OVERVIEW.md
  - documentation/01_THE_HOOK.md
  - documentation/02_ARCHITECTURE.md
  - documentation/03_USER_FLOW.md
  - documentation/04_BUSINESS_ROI.md
  - documentation/05_VISUAL_DESIGN.md

# GitHub Pages settings
github:
  repository_name: modular-agent-orchestrator