<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mao - Typewriter Terminal Interface</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="typewriter-container">
        <div class="paper-background">
            <div class="paper-texture"></div>
            <div class="paper-lines"></div>
        </div>
        
        <div class="typewriter-header">
            <div class="typewriter-brand">
                <div class="brand-plate">
                    <span class="model-name">MAO TERMINAL</span>
                    <span class="model-series">Series IV</span>
                </div>
            </div>
            
            <div class="ribbon-housing">
                <div class="ribbon-spool left-spool"></div>
                <div class="ribbon-spool right-spool"></div>
                <div class="ribbon-tape"></div>
            </div>
        </div>
        
        <div class="paper-holder">
            <div class="paper-sheet">
                <div class="letterhead">
                    <div class="logo-stamp">
                        <div class="cat-logo">~(=^‥^)</div>
                        <div class="stamp-text">Mao</div>
                        <div class="stamp-subtitle">Modular Agent Orchestrator</div>
                    </div>
                    <div class="date-stamp">
                        <span class="typed-date"></span>
                    </div>
                </div>
                
                <div class="document-content">
                    <div class="title-section">
                        <h1 class="typed-title">TERMINAL-NATIVE AI ORCHESTRATION</h1>
                        <div class="underline"></div>
                    </div>
                    
                    <div class="content-body">
                        <div class="typed-paragraph">
                            <p class="typing-line" data-text="Mao represents a new paradigm in AI orchestration; terminal-native design meets conversational intelligence. Built for developers who think in command lines and code."></p>
                        </div>
                        
                        <div class="features-list">
                            <div class="feature-item">
                                <span class="bullet">•</span>
                                <span class="feature-text typing-line" data-text="AGENT MANAGEMENT: Orchestrate multiple AI agents through terminal commands"></span>
                            </div>
                            <div class="feature-item">
                                <span class="bullet">•</span>
                                <span class="feature-text typing-line" data-text="WORKFLOW AUTOMATION: Build complex workflows through conversation"></span>
                            </div>
                            <div class="feature-item">
                                <span class="bullet">•</span>
                                <span class="feature-text typing-line" data-text="MEMORY SYSTEM: Persistent context across all interactions"></span>
                            </div>
                            <div class="feature-item">
                                <span class="bullet">•</span>
                                <span class="feature-text typing-line" data-text="LOCAL FIRST: Everything runs on your machine, your data stays yours"></span>
                            </div>
                        </div>
                        
                        <div class="code-section">
                            <div class="code-title">Installation & Usage:</div>
                            <div class="code-block">
                                <div class="code-line typing-line" data-text="$ curl -sSL install.mao.dev | bash"></div>
                                <div class="code-line typing-line" data-text="$ mao chat --model claude-sonnet-4" data-delay="1000"></div>
                                <div class="code-line typing-line" data-text="$ mao agents create --type researcher" data-delay="2000"></div>
                                <div class="code-line typing-line" data-text="$ mao workflow orchestrate --parallel" data-delay="3000"></div>
                            </div>
                        </div>
                        
                        <div class="signature-section">
                            <div class="signature-line">
                                <span class="signature-text">Built with terminal precision</span>
                                <div class="signature-flourish">~</div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="paper-margin left-margin"></div>
                <div class="paper-margin right-margin"></div>
            </div>
        </div>
        
        <div class="typewriter-keys">
            <div class="key-row">
                <div class="typewriter-key" data-key="M">M</div>
                <div class="typewriter-key" data-key="A">A</div>
                <div class="typewriter-key" data-key="O">O</div>
                <div class="space-key"></div>
                <div class="typewriter-key" data-key="T">T</div>
                <div class="typewriter-key" data-key="E">E</div>
                <div class="typewriter-key" data-key="R">R</div>
                <div class="typewriter-key" data-key="M">M</div>
            </div>
        </div>
        
        <div class="typewriter-base">
            <div class="carriage-return">
                <div class="return-lever"></div>
            </div>
        </div>
        
        <div class="paper-sounds">
            <!-- Sound effects will be triggered here -->
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
